# keiailab OSS · GitLab CI (self-contained, RFC-0043 spirit / shadow phase)
# Mirror of the local quality gates: biome/tsc -> build.
# allow_failure keeps this non-blocking until a runner + green baseline exist.
stages: [lint, build]

default:
  image: node:22

lint:
  stage: lint
  script:
    - npm ci || npm install
    - npx --yes @biomejs/biome ci . || npx tsc --noEmit || true
  allow_failure: true

build:
  stage: build
  script:
    - npm ci || npm install
    - npm run build || true
  allow_failure: true
